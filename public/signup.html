<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Agro Smart Farming</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-gray-100 font-poppins">
  <!-- Navbar -->
  <nav class="bg-green-600 text-white p-4">
    <div class="container mx-auto flex justify-between items-center">
      <a href="/index.html" class="flex items-center space-x-2">
        <img src="/logo.png" alt="Agro Smart Farming Logo" class="logo">
        <span class="navbar-heading">Agro Smart Farming</span>
      </a>
      <div class="space-x-4">
        <a href="/index.html" class="hover:underline">Home</a>
        <a href="/weather.html" class="hover:underline">Weather</a>
        <a href="/signup.html" class="hover:underline">Sign Up</a>
        <a href="/login.html" class="hover:underline">Login</a>
      </div>
    </div>
  </nav>

  <!-- Signup Form -->
  <section class="py-12">
    <div class="container mx-auto max-w-md">
      <div class="bg-white p-8 rounded-lg shadow-lg">
        <h2 class="text-2xl font-bold text-green-800 mb-6 text-center">Sign Up</h2>
        <form id="signupForm" class="space-y-4">
          <div>
            <input type="text" id="name" placeholder="Name" required class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
          </div>
          <div>
            <input type="email" id="email" placeholder="Email" required class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
          </div>
          <div>
            <input type="password" id="password" placeholder="Password" required class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
          </div>
          <div>
            <input type="text" id="district" placeholder="District" required class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
          </div>
          <button type="submit" class="w-full bg-green-600 text-white p-3 rounded-lg hover:bg-green-700 transition">Sign Up</button>
        </form>
        <p class="text-center mt-4"><a href="/index.html" class="text-green-600 hover:underline">Back to Home</a></p>
      </div>
    </div>
  </section>

  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const district = document.getElementById('district').value;

      const response = await fetch('/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password, district }),
      });

      const data = await response.json();
      if (response.ok) {
        localStorage.setItem('token', data.token);
        window.location.href = '/dashboard.html';
      } else {
        alert(data.message);
      }
    });
  </script>
</body>
</html>
